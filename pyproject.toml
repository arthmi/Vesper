[project]
name = "vesper"
version = "0.1.0"
description = "A minimal, keyboard-first Hyprland shell focused on productivity"
require-python = ">3.11"
dependencies = [
    "fabric @ git+https://github.com/Fabric-Development/fabric.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vesper"]

[tool.hatch.metadata]
allow-direct-references = true
